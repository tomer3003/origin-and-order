<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Origin & Order — D&D 2024 Character Builder</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
img{max-width:100%}
[hidden]{display:none!important}
:root{
  --bg:#EDEFEA; --surface:#FFFFFF; --surface-2:#F6F6F1; --border:#D8D9CD;
  --text:#1B211F; --text-dim:#5B6360; --accent:#A8632F; --accent-ink:#6E4014;
  --accent-2:#4E6B57; --arcane:#4C5C93; --danger:#9A3F35; --focus:#3B6FB6;
  --shadow: 0 1px 2px rgba(20,24,20,.06), 0 6px 16px rgba(20,24,20,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12151A; --surface:#1A1F26; --surface-2:#20262E; --border:#323A44;
    --text:#E7E9E4; --text-dim:#9AA3AA; --accent:#C98A46; --accent-ink:#F0B673;
    --accent-2:#7FA98D; --arcane:#8C9BDB; --danger:#D97C70; --focus:#6FA0E0;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#12151A; --surface:#1A1F26; --surface-2:#20262E; --border:#323A44;
  --text:#E7E9E4; --text-dim:#9AA3AA; --accent:#C98A46; --accent-ink:#F0B673;
  --accent-2:#7FA98D; --arcane:#8C9BDB; --danger:#D97C70; --focus:#6FA0E0;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text);
  font-family:"Source Serif 4", Georgia, "Times New Roman", serif;
  font-size:15.5px; line-height:1.5;
}
h1,h2,h3,.display{font-family:"Cinzel","Source Serif 4",serif; letter-spacing:.02em; text-wrap:balance;}
.mono, .stat-num, .stat-val, .badge, .step-num{font-family:"JetBrains Mono", ui-monospace, monospace; font-variant-numeric:tabular-nums;}
button{font-family:inherit;}
a{color:var(--focus);}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px;}

.app{max-width:1280px; margin:0 auto; padding:20px 20px 64px;}

/* ---- Header ---- */
.masthead{display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:18px; flex-wrap:wrap;}
.masthead h1{font-size:26px; font-weight:700; margin:0; color:var(--text);}
.masthead .sub{color:var(--text-dim); font-size:13px; margin-top:2px;}
.masthead-right{display:flex; gap:8px; align-items:center;}
.iconbtn{
  border:1px solid var(--border); background:var(--surface); color:var(--text-dim);
  border-radius:7px; padding:7px 11px; font-size:12.5px; cursor:pointer;
}
.iconbtn:hover{color:var(--text); border-color:var(--accent);}

/* ---- Step tracker ---- */
.tracker{display:flex; gap:0; margin-bottom:22px; border:1px solid var(--border); border-radius:10px; overflow:auto; background:var(--surface);}
.tstep{
  flex:1; min-width:118px; display:flex; align-items:center; gap:8px; padding:11px 14px; cursor:pointer;
  border-right:1px solid var(--border); position:relative; background:transparent; color:var(--text-dim);
  transition:background .15s;
}
.tstep:last-child{border-right:none;}
.tstep:hover{background:var(--surface-2);}
.tstep.done{color:var(--text);}
.tstep.active{background:var(--surface-2); color:var(--text);}
.tstep.active .step-num{background:var(--accent); color:#fff; border-color:var(--accent);}
.tstep.locked{cursor:not-allowed; opacity:.45;}
.step-num{
  width:22px; height:22px; border-radius:50%; border:1.5px solid var(--border); display:flex;
  align-items:center; justify-content:center; font-size:11px; flex:none; background:var(--surface);
}
.tstep.done .step-num{border-color:var(--accent-2); color:var(--accent-2);}
.tstep-label{font-size:12.5px; font-weight:600; letter-spacing:.01em;}

/* ---- Layout ---- */
.layout{display:grid; grid-template-columns:1fr 340px; gap:22px; align-items:start;}
@media (max-width:900px){ .layout{grid-template-columns:1fr;} }

.panel{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:22px; box-shadow:var(--shadow);}
.panel h2{font-size:20px; margin:0 0 4px;}
.panel .lede{color:var(--text-dim); font-size:13.5px; margin:0 0 18px; max-width:64ch;}

/* ---- Choice cards ---- */
.grid-cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:10px;}
.ccard{
  border:1.5px solid var(--border); border-radius:10px; padding:13px 14px; cursor:pointer; background:var(--surface-2);
  text-align:left; display:flex; flex-direction:column; gap:4px; transition:border-color .15s, transform .1s;
}
.ccard:hover{border-color:var(--accent);}
.ccard.selected{border-color:var(--accent); background:color-mix(in srgb, var(--accent) 12%, var(--surface-2));}
.ccard .cname{font-family:"Cinzel"; font-weight:600; font-size:14.5px;}
.ccard .cmeta{font-size:12px; color:var(--text-dim);}
.ccard .ctag{font-size:10.5px; color:var(--accent-ink); text-transform:uppercase; letter-spacing:.06em; font-weight:600;}

/* ---- Detail block ---- */
.detail{margin-top:18px; border-top:1px dashed var(--border); padding-top:16px;}
.kv-row{display:flex; gap:18px; flex-wrap:wrap; margin-bottom:12px;}
.kv{display:flex; flex-direction:column; gap:2px; min-width:120px;}
.kv .k{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-dim);}
.kv .v{font-size:13.5px;}
.feat-list{margin:0; padding-left:0; list-style:none; display:flex; flex-direction:column; gap:7px;}
.feat-list li{font-size:13.5px; padding-left:14px; position:relative;}
.feat-list li::before{content:"—"; position:absolute; left:0; color:var(--accent);}
.feat-list b{font-family:"Cinzel"; font-weight:600; font-size:12.5px;}

fieldset{border:1px solid var(--border); border-radius:8px; padding:12px 14px; margin:0 0 14px;}
legend{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-dim); padding:0 4px;}
.optrow{display:flex; align-items:flex-start; gap:8px; margin-bottom:8px; font-size:13.5px;}
.optrow:last-child{margin-bottom:0;}
.optrow input{margin-top:3px;}
select, input[type=text], input[type=number]{
  background:var(--surface); border:1px solid var(--border); color:var(--text); border-radius:6px;
  padding:6px 9px; font-size:13.5px; font-family:inherit;
}
select:focus, input:focus{border-color:var(--focus);}
.chip-select{display:flex; flex-wrap:wrap; gap:6px;}
.chip{
  border:1px solid var(--border); border-radius:20px; padding:5px 12px; font-size:12.5px; cursor:pointer; background:var(--surface);
  color:var(--text-dim);
}
.chip.on{background:var(--accent); border-color:var(--accent); color:#fff;}
.chip.disabled{opacity:.35; cursor:not-allowed;}
.hint{font-size:12px; color:var(--text-dim); margin-top:4px;}
.warn{color:var(--danger); font-size:12.5px; margin-top:6px;}

/* ---- Nav buttons ---- */
.stepnav{display:flex; justify-content:space-between; margin-top:22px; padding-top:16px; border-top:1px solid var(--border);}
.btn{
  border:1px solid var(--border); background:var(--surface-2); color:var(--text); border-radius:8px;
  padding:9px 18px; font-size:13.5px; font-weight:600; cursor:pointer; font-family:"Cinzel";
}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
.btn:disabled{opacity:.4; cursor:not-allowed;}
.btn.ghost{background:transparent;}

/* ---- Ability scores ---- */
.method-toggle{display:flex; gap:8px; margin-bottom:16px;}
.method-toggle .chip{border-radius:8px; padding:8px 14px;}
.ability-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
@media (max-width:560px){.ability-grid{grid-template-columns:repeat(2,1fr);}}
.ability-card{border:1px solid var(--border); border-radius:10px; padding:12px; background:var(--surface-2); text-align:center;}
.ability-card .aname{font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--text-dim);}
.ability-card .ascore{font-size:26px; font-weight:600; margin:4px 0 0;}
.ability-card .amod{font-size:12.5px; color:var(--accent-ink);}
.ability-card .abonus{font-size:10.5px; color:var(--accent-2); min-height:14px;}
.stepper{display:flex; align-items:center; justify-content:center; gap:8px; margin-top:6px;}
.stepper button{width:24px; height:24px; border-radius:6px; border:1px solid var(--border); background:var(--surface); cursor:pointer; color:var(--text); font-size:14px; line-height:1;}
.pb-remaining{text-align:center; font-size:13px; margin-bottom:12px; color:var(--text-dim);}
.pb-remaining b{color:var(--text);}

/* ---- Alignment grid ---- */
.align-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; max-width:460px;}
.align-cell{
  border:1.5px solid var(--border); border-radius:8px; padding:12px 8px; text-align:center; cursor:pointer;
  font-size:12px; background:var(--surface-2);
}
.align-cell:hover{border-color:var(--accent);}
.align-cell.selected{border-color:var(--accent); background:color-mix(in srgb, var(--accent) 14%, var(--surface-2)); font-weight:600;}

textarea{
  width:100%; background:var(--surface); border:1px solid var(--border); color:var(--text); border-radius:6px;
  padding:9px; font-family:inherit; font-size:13.5px; resize:vertical;
}
label.field{display:block; margin-bottom:14px;}
label.field .k{display:block; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-dim); margin-bottom:5px;}
input.full{width:100%;}

/* ---- Sheet panel ---- */
.sheet{position:sticky; top:20px; display:flex; flex-direction:column; gap:14px;}
.sheet-card{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:18px; box-shadow:var(--shadow);}
.sheet-name{font-family:"Cinzel"; font-size:19px; font-weight:700; margin:0;}
.sheet-tagline{font-size:12px; color:var(--text-dim); margin-top:2px;}
.sheet-grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:14px;}
.stat-tile{border:1px solid var(--border); border-radius:8px; padding:8px 6px; text-align:center; background:var(--surface-2);}
.stat-tile .stat-label{font-size:9.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-dim);}
.stat-tile .stat-num{font-size:20px; font-weight:600; display:block; margin-top:2px;}
.stat-tile.hp .stat-num{color:var(--danger);}
.stat-tile.ac .stat-num{color:var(--accent-2);}
.stat-tile.pb .stat-num{color:var(--arcane);}
.sheet-abilities{display:grid; grid-template-columns:repeat(6,1fr); gap:6px; margin-top:12px;}
.sa{border:1px solid var(--border); border-radius:7px; text-align:center; padding:5px 2px; background:var(--surface-2);}
.sa .aab{font-size:9px; color:var(--text-dim); text-transform:uppercase;}
.sa .amod2{font-size:14px; font-weight:600;}
.sa .asc{font-size:9.5px; color:var(--text-dim);}
.sheet-section{margin-top:14px; padding-top:12px; border-top:1px dashed var(--border);}
.sheet-section h3{font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--text-dim); margin:0 0 8px; font-family:"Source Serif 4"; font-weight:600;}
.tagrow{display:flex; flex-wrap:wrap; gap:5px;}
.tag{font-size:11px; border:1px solid var(--border); border-radius:20px; padding:2px 9px; background:var(--surface-2);}
.tag.save{border-color:var(--arcane); color:var(--arcane);}
.linelist{margin:0; padding:0; list-style:none; font-size:12.5px; display:flex; flex-direction:column; gap:4px;}
.linelist .row{display:flex; justify-content:space-between; gap:6px;}
.linelist .row .l{color:var(--text-dim);}
.empty-note{font-size:12.5px; color:var(--text-dim); font-style:italic;}
.copybtn{width:100%; margin-top:4px;}
.level-row{display:flex; align-items:center; gap:10px; margin-bottom:6px;}
.level-row select{flex:none;}

/* ---- Feats/species callouts ---- */
.callout{background:var(--surface-2); border-left:3px solid var(--accent); border-radius:0 8px 8px 0; padding:10px 12px; font-size:13px; margin:10px 0;}

@media print{ .tracker,.stepnav,.masthead-right{display:none;} .layout{grid-template-columns:1fr;} }
</style>
</head>
<body>

<div class="app">
  <div class="masthead">
    <div>
      <h1>Origin &amp; Order</h1>
      <div class="sub">A level-1 character builder for the 2024 Player's Handbook</div>
    </div>
    <div class="masthead-right">
      <button class="iconbtn" id="resetBtn" title="Clear all choices and start over">Start over</button>
    </div>
  </div>

  <div class="tracker" id="tracker"></div>

  <div class="layout">
    <div class="panel" id="stepPanel"></div>
    <div class="sheet">
      <div class="sheet-card" id="sheetCard"></div>
    </div>
  </div>
</div>

<script>
/* ============================== DATA ============================== */

const ABILS = ["str","dex","con","int","wis","cha"];
const ABIL_NAME = {str:"Strength",dex:"Dexterity",con:"Constitution",int:"Intelligence",wis:"Wisdom",cha:"Charisma"};

const SKILLS = {
  athletics:{name:"Athletics",ab:"str"},
  acrobatics:{name:"Acrobatics",ab:"dex"}, sleightOfHand:{name:"Sleight of Hand",ab:"dex"}, stealth:{name:"Stealth",ab:"dex"},
  arcana:{name:"Arcana",ab:"int"}, history:{name:"History",ab:"int"}, investigation:{name:"Investigation",ab:"int"}, nature:{name:"Nature",ab:"int"}, religion:{name:"Religion",ab:"int"},
  animalHandling:{name:"Animal Handling",ab:"wis"}, insight:{name:"Insight",ab:"wis"}, medicine:{name:"Medicine",ab:"wis"}, perception:{name:"Perception",ab:"wis"}, survival:{name:"Survival",ab:"wis"},
  deception:{name:"Deception",ab:"cha"}, intimidation:{name:"Intimidation",ab:"cha"}, performance:{name:"Performance",ab:"cha"}, persuasion:{name:"Persuasion",ab:"cha"}
};

const HD_AVG = {6:4, 8:5, 10:6, 12:7};

// Shared prepared-caster progression (Cleric & Wizard use the same table in the 2024 PHB)
const PREP_TABLE = [4,5,6,7,9,10,11,12,14,15,16,16,16,17,18,18,19,20,21,22]; // index 0 = level 1
const CANTRIP_TABLE_LV = [1,4,10]; // levels at which +1 cantrip known
const FULL_SLOTS = { // level -> [slot1..slot9]
  1:[2],2:[3],3:[4,2],4:[4,3],5:[4,3,2],6:[4,3,3],7:[4,3,3,1],8:[4,3,3,2],9:[4,3,3,3,1],10:[4,3,3,3,2],
  11:[4,3,3,3,2,1],12:[4,3,3,3,2,1],13:[4,3,3,3,2,1,1],14:[4,3,3,3,2,1,1],15:[4,3,3,3,2,1,1,1],16:[4,3,3,3,2,1,1,1],
  17:[4,3,3,3,2,1,1,1,1],18:[4,3,3,3,3,1,1,1,1],19:[4,3,3,3,3,2,1,1,1],20:[4,3,3,3,3,2,2,1,1]
};

const ARMOR = {
  none:{name:"No armor",base:10,dexCap:null,category:"none"},
  robe:{name:"Robe (clothing)",base:10,dexCap:null,category:"none"},
  leather:{name:"Leather Armor",base:11,dexCap:null,category:"light"},
  studded:{name:"Studded Leather Armor",base:12,dexCap:null,category:"light"},
  chainShirt:{name:"Chain Shirt",base:13,dexCap:2,category:"medium"},
  chainMail:{name:"Chain Mail",base:16,dexCap:0,category:"heavy",strReq:13}
};

const CANTRIP_OPTIONS = {
  wizard:["Fire Bolt","Light","Mage Hand","Minor Illusion","Prestidigitation","Ray of Frost"],
  cleric:["Guidance","Sacred Flame","Spare the Dying","Thaumaturgy"]
};
const LVL1_SPELL_OPTIONS = {
  wizard:["Burning Hands","Chromatic Orb","Detect Magic","Feather Fall","Mage Armor","Magic Missile","Shield","Sleep","Thunderwave"],
  cleric:["Bless","Cure Wounds","Guiding Bolt","Healing Word","Sanctuary","Shield of Faith"]
};

const CLASSES = {
  fighter:{
    name:"Fighter", tagline:"A master of every weapon and armor", primary:"Strength or Dexterity", hitDie:10,
    saves:["str","con"], skillCount:2,
    skillOptions:["acrobatics","animalHandling","athletics","history","insight","intimidation","persuasion","perception","survival"],
    weaponProf:"Simple and Martial weapons", armorTraining:"Light, Medium, Heavy armor, and Shields",
    equipment:[
      {key:"A", label:"Chain Mail, Greatsword, Flail, 8 Javelins, Dungeoneer's Pack, 4 GP", armor:"chainMail", shield:false},
      {key:"B", label:"Studded Leather Armor, Scimitar, Shortsword, Longbow + 20 Arrows, Dungeoneer's Pack, 11 GP", armor:"studded", shield:false},
      {key:"C", label:"155 GP (buy your own gear)", armor:"none", shield:false}
    ],
    level1Features:[
      {name:"Fighting Style", text:"You gain a Fighting Style feat (Defense, Archery, Dueling, etc.), shaping how you fight."},
      {name:"Second Wind", text:"Bonus Action: regain 1d10 + Fighter level HP. 2 uses, refills on a Short or Long Rest."},
      {name:"Weapon Mastery", text:"You can use the mastery property of 3 kinds of Simple or Martial weapons you choose; swap them on a Long Rest."}
    ],
    isCaster:false
  },
  wizard:{
    name:"Wizard", tagline:"A scholarly caster of arcane power", primary:"Intelligence", hitDie:6,
    saves:["int","wis"], skillCount:2,
    skillOptions:["arcana","history","insight","investigation","medicine","nature","religion"],
    weaponProf:"Simple weapons", armorTraining:"None",
    equipment:[
      {key:"A", label:"2 Daggers, Arcane Focus (Quarterstaff), Robe, Spellbook, Scholar's Pack, 5 GP", armor:"robe", shield:false},
      {key:"B", label:"55 GP (buy your own gear)", armor:"none", shield:false}
    ],
    level1Features:[
      {name:"Spellcasting", text:"Prepare spells from your spellbook using Intelligence; cast rituals straight from the book (Ritual Adept)."},
      {name:"Arcane Recovery", text:"Once per day after a Short Rest, recover spent spell slots totalling up to half your Wizard level (round up)."}
    ],
    isCaster:true, castAbility:"int", cantripsBase:3, spellbookStart:6
  },
  cleric:{
    name:"Cleric", tagline:"A miraculous priest of divine power", primary:"Wisdom", hitDie:8,
    saves:["wis","cha"], skillCount:2,
    skillOptions:["history","insight","medicine","persuasion","religion"],
    weaponProf:"Simple weapons", armorTraining:"Light and Medium armor, and Shields",
    equipment:[
      {key:"A", label:"Chain Shirt, Shield, Mace, Holy Symbol, Priest's Pack, 7 GP", armor:"chainShirt", shield:true},
      {key:"B", label:"110 GP (buy your own gear)", armor:"none", shield:false}
    ],
    level1Features:[
      {name:"Spellcasting", text:"Prepare spells from the Cleric list using Wisdom; you know 3 cantrips."},
      {name:"Divine Order", text:"Choose Protector (Martial weapons + Heavy armor training) or Thaumaturge (extra cantrip + Wisdom bonus to Arcana/Religion checks)."}
    ],
    isCaster:true, castAbility:"wis", cantripsBase:3,
    divineOrderOptions:["Protector","Thaumaturge"]
  },
  rogue:{
    name:"Rogue", tagline:"A dexterous expert in stealth and subterfuge", primary:"Dexterity", hitDie:8,
    saves:["dex","int"], skillCount:4,
    skillOptions:["acrobatics","athletics","deception","insight","intimidation","investigation","perception","persuasion","sleightOfHand","stealth"],
    weaponProf:"Simple weapons, and Martial weapons with the Finesse or Light property", armorTraining:"Light armor",
    equipment:[
      {key:"A", label:"Leather Armor, 2 Daggers, Shortsword, Shortbow + 20 Arrows, Thieves' Tools, Burglar's Pack, 8 GP", armor:"leather", shield:false},
      {key:"B", label:"100 GP (buy your own gear)", armor:"none", shield:false}
    ],
    level1Features:[
      {name:"Expertise", text:"Double your proficiency bonus for 2 of your skill proficiencies (Stealth and Sleight of Hand recommended)."},
      {name:"Sneak Attack", text:"Once per turn, add 1d6 extra damage on a hit with Advantage (or an ally adjacent to the target) using a Finesse or Ranged weapon."},
      {name:"Thieves' Cant", text:"You know Thieves' Cant and one other language."},
      {name:"Weapon Mastery", text:"You can use the mastery property of 2 kinds of weapons you're proficient with."}
    ],
    isCaster:false, expertiseCount:2
  }
};

const SPECIES = {
  human:{
    name:"Human", tagline:"Ambitious and everywhere", size:"Medium", speed:30,
    traits:[
      {name:"Resourceful", text:"You gain Heroic Inspiration whenever you finish a Long Rest."},
      {name:"Skillful", text:"You gain proficiency in one skill of your choice."},
      {name:"Versatile", text:"You gain an Origin feat of your choice (Skilled is recommended)."}
    ],
    grantsSkillChoice:1, grantsOriginFeat:true
  },
  elf:{
    name:"Elf", tagline:"Fey-touched and keen-sensed", size:"Medium", speed:30,
    traits:[
      {name:"Darkvision", text:"60 feet."},
      {name:"Fey Ancestry", text:"Advantage on saves against being Charmed."},
      {name:"Keen Senses", text:"Proficiency in Insight, Perception, or Survival (your choice)."},
      {name:"Trance", text:"You don't sleep; a 4-hour trance counts as a Long Rest."}
    ],
    lineageChoice:{
      drow:{name:"Drow", text:"Darkvision extends to 120 ft.; you know Dancing Lights."},
      highElf:{name:"High Elf", text:"You know Prestidigitation (swappable each Long Rest)."},
      woodElf:{name:"Wood Elf", text:"Speed increases to 35 ft.; you know Druidcraft."}
    },
    keenSensesChoice:["insight","perception","survival"]
  },
  dwarf:{
    name:"Dwarf", tagline:"Stout, stone-touched, and hard to poison", size:"Medium", speed:30,
    traits:[
      {name:"Darkvision", text:"120 feet."},
      {name:"Dwarven Resilience", text:"Resistance to Poison damage; Advantage on saves vs. the Poisoned condition."},
      {name:"Dwarven Toughness", text:"+1 Hit Point maximum, and +1 again every level."},
      {name:"Stonecunning", text:"Bonus Action: Tremorsense 60 ft. for 10 min while touching stone, usable Proficiency Bonus times/day."}
    ],
    hpBonusPerLevel:1
  },
  halfling:{
    name:"Halfling", tagline:"Small, lucky, and hard to pin down", size:"Small", speed:30,
    traits:[

const PB_COST = {8:0,9:1,10:2,11:3,12:4,13:5,14:7,15:9};

/* ============================== STATE ============================== */

const STEPS = ["class","species","background","abilities","identity","sheet"];

const DEFAULT_STATE = {

  background:null,

  abilityMethod:"standard",
  abilityAssign:{str:null,dex:null,con:null,int:null,wis:null,cha:null},
  pointBuy:{str:8,dex:8,con:8,int:8,wis:8,cha:8},
  alignment:null,
  identity:{ name:"", pronouns:"", appearance:"", backstory:"" }
};

let state = loadState();

function loadState(){
  try{
    const raw = localStorage.getItem("originOrderCharacter");
    if(raw){
      const parsed = JSON.parse(raw);
      return Object.assign(structuredClone(DEFAULT_STATE), parsed);
    }
  }catch(e){}
  return structuredClone(DEFAULT_STATE);
}
function saveState(){
  try{ localStorage.setItem("originOrderCharacter", JSON.stringify(state)); }catch(e){}
}

/* ============================== HELPERS ============================== */

function mod(score){ return Math.floor((score-10)/2); }
function fmtMod(m){ return m>=0 ? "+"+m : String(m); }
function profBonus(level){ return 2 + Math.floor((level-1)/4); }

function selectedClass(){ return state.className ? CLASSES[state.className] : null; }
function selectedSpecies(){ return state.speciesName ? SPECIES[state.speciesName] : null; }
function selectedBackground(){ return state.background ? BACKGROUNDS[state.background] : null; }

function baseAbilityScores(){
  const out = {};
  ABILS.forEach(a=>{
    if(state.abilityMethod==="standard") out[a] = state.abilityAssign[a] || null;
    else out[a] = state.pointBuy[a];
  });
  return out;
}

function backgroundBonus(){
  const bonus = {str:0,dex:0,con:0,int:0,wis:0,cha:0};
  const bg = selectedBackground();
  if(!bg) return bonus;
  if(state.bgChoices.abilityMode==="21"){
    const picks = state.bgChoices.abilityPicks; // [plus2Ability, plus1Ability]
    if(picks[0]) bonus[picks[0]] += 2;
    if(picks[1]) bonus[picks[1]] += 1;
  } else {
    bg.abilities.forEach(a=> bonus[a]+=1);
  }
  return bonus;
}

function finalAbilityScores(){
  const base = baseAbilityScores();
  const bonus = backgroundBonus();
  const out = {};
  ABILS.forEach(a=> out[a] = (base[a]||0) + bonus[a]);
  return out;
}

function pointBuyTotalCost(){
  return ABILS.reduce((sum,a)=> sum + (PB_COST[state.pointBuy[a]] ?? 0), 0);
}

function availableStandardValues(){
  // multiset difference: STANDARD_ARRAY minus currently assigned values
  const remaining = [...STANDARD_ARRAY];
  ABILS.forEach(a=>{
    const v = state.abilityAssign[a];
    if(v!==null && v!==undefined){
      const idx = remaining.indexOf(v);
      if(idx>-1) remaining.splice(idx,1);
    }
  });
  return remaining;
}

function classSkillSet(){
  // proficient skills: class-chosen + background fixed + species extras
  const set = new Set();
  state.classChoices.skills.forEach(s=>set.add(s));
  const bg = selectedBackground();
  if(bg) bg.skills.forEach(s=>set.add(s));
  if(state.speciesName==="human" && state.speciesChoices.humanSkill) set.add(state.speciesChoices.humanSkill);
  if(state.speciesName==="elf" && state.speciesChoices.elfKeenSense) set.add(state.speciesChoices.elfKeenSense);
  return set;
}

function expertiseSet(){
  return new Set(state.classChoices.expertiseSkills || []);
}

function computeHP(level){
  const cls = selectedClass();
  if(!cls) return null;
  const scores = finalAbilityScores();
  const conMod = mod(scores.con||10);
  let hp = cls.hitDie + conMod;
  for(let l=2;l<=level;l++){
    hp += HD_AVG[cls.hitDie] + conMod;
  }
  if(state.speciesName==="dwarf") hp += level; // Dwarven Toughness: +1/level
  return hp;
}

function computeAC(){
  const cls = selectedClass();
  const scores = finalAbilityScores();
  const dexMod = mod(scores.dex||10);
  const eq = cls && cls.equipment.find(e=>e.key===state.classChoices.equipment);
  const armorKey = eq ? eq.armor : "none";
  const armor = ARMOR[armorKey] || ARMOR.none;
  let ac = armor.base;
  if(armor.dexCap===null) ac += dexMod;
  else if(armor.dexCap>0) ac += Math.min(dexMod, armor.dexCap);
  // dexCap 0 => no dex bonus (heavy)
  if(eq && eq.shield) ac += 2;
  if(!cls){ ac = 10 + dexMod; }
  return ac;
}

function copyToClipboard(text){
  navigator.clipboard?.writeText(text).then(()=>{
    const btn = document.getElementById("copySheetBtn");
    if(btn){ const old = btn.textContent; btn.textContent="Copied!"; setTimeout(()=>btn.textContent=old,1400); }
  }).catch(()=>{});
}

/* ============================== VALIDATION ============================== */

function stepValid(stepKey){
  switch(stepKey){
    case "class":{
      if(!state.className) return false;
      const cls = selectedClass();
      if(state.classChoices.skills.length !== cls.skillCount) return false;
      if(!state.classChoices.equipment) return false;
      if(cls.divineOrderOptions && !state.classChoices.divineOrder) return false;
      if(cls.isCaster){
        if(state.classChoices.cantrips.length !== cls.cantripsBase) return false;
        if(state.classChoices.lvl1Spells.length < 1) return false;
      }
      if(cls.expertiseCount && state.classChoices.expertiseSkills.length !== cls.expertiseCount) return false;
      return true;
    }
    case "species":{
      if(!state.speciesName) return false;
      if(state.speciesName==="human" && !state.speciesChoices.humanSkill) return false;
      if(state.speciesName==="elf" && (!state.speciesChoices.elfLineage || !state.speciesChoices.elfKeenSense)) return false;
      if(state.speciesName==="dragonborn" && !state.speciesChoices.dragonAncestry) return false;
      return true;
    }
    case "background":{
      if(!state.background) return false;
      if(state.bgChoices.abilityMode==="21"){
        const p = state.bgChoices.abilityPicks;
        if(!p[0] || !p[1] || p[0]===p[1]) return false;
      }
      return true;
    }
    case "abilities":{
      if(state.abilityMethod==="standard"){
        return ABILS.every(a=>state.abilityAssign[a]!==null && state.abilityAssign[a]!==undefined);
      } else {
        return pointBuyTotalCost() <= 27;
      }
    }
    case "identity":{
      return !!state.alignment && state.identity.name.trim().length>0;
    }
    default: return true;
  }
}

function furthestUnlockedStep(){
  for(let i=0;i<STEPS.length-1;i++){
    if(!stepValid(STEPS[i])) return i;
  }
  return STEPS.length-1;
}

/* ============================== RENDER: TRACKER ============================== */

function renderTracker(){
  const el = document.getElementById("tracker");
  const unlocked = furthestUnlockedStep();
  el.innerHTML = "";
  STEPS.forEach((key,i)=>{
    const div = document.createElement("div");
    const done = i<unlocked || (i===unlocked && stepValid(key) && i<STEPS.length-1);
    let cls = "tstep";
    if(i===state.step) cls+=" active";
    if(i<=unlocked) { /* clickable */ } else cls+=" locked";
    if(i<unlocked) cls += " done";
    div.className = cls;
    div.innerHTML = `<span class="step-num">${i<unlocked?"✓":i+1}</span><span class="tstep-label">${STEP_LABEL[key]}</span>`;
    if(i<=unlocked){
      div.addEventListener("click", ()=>{ state.step=i; saveState(); renderAll(); });
    }
    el.appendChild(div);
  });
}

/* ============================== RENDER: STEP PANEL ============================== */

function renderAll(){
  renderTracker();
  renderStep();
  renderSheet();
  saveState();
  window.scrollTo({top:0});
}

function renderStep(){
  const key = STEPS[state.step];
  const panel = document.getElementById("stepPanel");
  panel.innerHTML = "";
  const build = {
    class: buildClassStep, species: buildSpeciesStep, background: buildBackgroundStep,
    abilities: buildAbilitiesStep, identity: buildIdentityStep, sheet: buildSheetStep
  }[key];
  build(panel);
  if(key!=="sheet") renderNav(panel, key);
}

function renderNav(panel, key){
  const nav = document.createElement("div");
  nav.className = "stepnav";
  const backBtn = document.createElement("button");
  backBtn.className = "btn ghost";
  backBtn.textContent = "← Back";
  backBtn.disabled = state.step===0;
  backBtn.onclick = ()=>{ state.step = Math.max(0,state.step-1); renderAll(); };

  const nextBtn = document.createElement("button");
  nextBtn.className = "btn primary";
  nextBtn.textContent = state.step===STEPS.length-2 ? "View Character Sheet →" : "Continue →";
  nextBtn.disabled = !stepValid(key);
  nextBtn.onclick = ()=>{ state.step = Math.min(STEPS.length-1,state.step+1); renderAll(); };

  nav.appendChild(backBtn);
  nav.appendChild(nextBtn);
  panel.appendChild(nav);
}

/* ---- Step 1: Class ---- */
function buildClassStep(panel){
  panel.innerHTML = `<h2>Choose a Class</h2><p class="lede">Your class is the adventuring path you follow — it grants your core combat and magical capabilities.</p>`;
  const grid = document.createElement("div");
  grid.className = "grid-cards";
  Object.entries(CLASSES).forEach(([key,c])=>{
    const card = document.createElement("button");
    card.className = "ccard" + (state.className===key ? " selected":"");
    card.innerHTML = `<span class="ctag">d${c.hitDie} hit die</span><span class="cname">${c.name}</span><span class="cmeta">${c.tagline}</span>`;
    card.onclick = ()=>{
      if(state.className!==key){
        state.className = key;
        state.classChoices = structuredClone(DEFAULT_STATE.classChoices);
      }
      renderAll();
    };
    grid.appendChild(card);
  });
  panel.appendChild(grid);

  if(state.className) panel.appendChild(buildClassDetail());
}

function buildClassDetail(){
  const cls = selectedClass();
  const wrap = document.createElement("div");
  wrap.className = "detail";

  const kv = document.createElement("div");
  kv.className = "kv-row";
  kv.innerHTML = `
    <div class="kv"><span class="k">Primary Ability</span><span class="v">${cls.primary}</span></div>
    <div class="kv"><span class="k">Hit Point Die</span><span class="v mono">d${cls.hitDie}</span></div>
    <div class="kv"><span class="k">Saving Throws</span><span class="v">${cls.saves.map(a=>ABIL_NAME[a]).join(", ")}</span></div>
    <div class="kv"><span class="k">Weapons</span><span class="v">${cls.weaponProf}</span></div>
    <div class="kv"><span class="k">Armor Training</span><span class="v">${cls.armorTraining}</span></div>
  `;
  wrap.appendChild(kv);

  // Skill choice
  const skillFs = document.createElement("fieldset");
  skillFs.innerHTML = `<legend>Skill Proficiencies — choose ${cls.skillCount}</legend>`;
  const chipWrap = document.createElement("div");
  chipWrap.className = "chip-select";
  cls.skillOptions.forEach(sk=>{
    const on = state.classChoices.skills.includes(sk);
    const chip = document.createElement("button");
    chip.type="button";
    chip.className = "chip" + (on?" on":"");
    chip.textContent = SKILLS[sk].name;
    chip.onclick = ()=>{
      if(on){ state.classChoices.skills = state.classChoices.skills.filter(s=>s!==sk); }

  wrap.appendChild(skillFs);

  // Equipment choice

  eqFs.innerHTML = `<legend>Starting Equipment</legend>`;
  cls.equipment.forEach(opt=>{
    const row = document.createElement("label");
    row.className = "optrow";
    row.innerHTML = `<input type="radio" name="eq" ${state.classChoices.equipment===opt.key?"checked":""}/> <span><b>(${opt.key})</b> ${opt.label}</span>`;
    row.querySelector("input").onclick = ()=>{ state.classChoices.equipment = opt.key; renderAll(); };
    eqFs.appendChild(row);
  });
  wrap.appendChild(eqFs);

  // Cleric Divine Order
  if(cls.divineOrderOptions){
    const fs = document.createElement("fieldset");
    fs.innerHTML = `<legend>Divine Order</legend>`;
    cls.divineOrderOptions.forEach(opt=>{
      const row = document.createElement("label");
      row.className="optrow";
      row.innerHTML = `<input type="radio" name="divord" ${state.classChoices.divineOrder===opt?"checked":""}/> <span><b>${opt}</b> — ${opt==="Protector"?"Martial weapons + Heavy armor training.":"Extra cantrip + Wisdom bonus to Arcana/Religion checks."}</span>`;
      row.querySelector("input").onclick = ()=>{ state.classChoices.divineOrder = opt; renderAll(); };
      fs.appendChild(row);
    });
    wrap.appendChild(fs);
  }

  // Rogue expertise
  if(cls.expertiseCount){
    const fs = document.createElement("fieldset");
    fs.innerHTML = `<legend>Expertise — choose ${cls.expertiseCount} skills you have proficiency in</legend>`;
    const cw = document.createElement("div");
    cw.className="chip-select";
    const availableSkills = state.classChoices.skills;
    if(availableSkills.length===0){
      cw.innerHTML = `<span class="hint">Choose your skill proficiencies above first.</span>`;
    } else {
      availableSkills.forEach(sk=>{
        const on = state.classChoices.expertiseSkills.includes(sk);

        chip.type="button"; chip.className="chip"+(on?" on":"");

          else if(state.classChoices.expertiseSkills.length<cls.expertiseCount) state.classChoices.expertiseSkills.push(sk);
          renderAll();

      });

        else if(state.classChoices.cantrips.length<cls.cantripsBase) state.classChoices.cantrips.push(sp);

    wrap.appendChild(fs);

    fs2.innerHTML = `<legend>${key==="wizard"?"Spellbook — choose "+need+" level-1 spells":"Prepared Spells — choose 4 level-1 spells"}</legend><div class="hint">${key==="wizard"?"Your spellbook holds these; you'll prepare a subset each day.":"These are the spells you have ready to cast today."}</div>`;
    const cw2 = document.createElement("div"); cw2.className="chip-select"; cw2.style.marginTop="8px";
    LVL1_SPELL_OPTIONS[key].forEach(sp=>{
      const on = state.classChoices.lvl1Spells.includes(sp);

    wrap.appendChild(fs2);
  }

  // Level 1 features

  feats.appendChild(ul);
  wrap.appendChild(feats);

  return wrap;
}

/* ---- Step 3: Background ---- */

  Object.entries(BACKGROUNDS).forEach(([key,b])=>{
    const card = document.createElement("button");
    card.className = "ccard" + (state.background===key?" selected":"");
    card.innerHTML = `<span class="ctag">${b.feat}</span><span class="cname">${key}</span><span class="cmeta">${b.abilities.map(a=>ABIL_NAME[a]).join(" / ")}</span>`;
    card.onclick = ()=>{
      if(state.background!==key){ state.background=key; state.bgChoices = structuredClone(DEFAULT_STATE.bgChoices); }
      renderAll();

  });
  panel.appendChild(grid);

}

    });
    fs.appendChild(row);

    row2.innerHTML = `<span class="hint" style="align-self:center;">+1 to:</span>`;

      const disabled = state.bgChoices.abilityPicks[0]===a;

/* ---- Step 4: Abilities ---- */
function buildAbilitiesStep(panel){
  panel.innerHTML = `<h2>Determine Ability Scores</h2><p class="lede">Generate your six ability scores, then background bonuses apply automatically.</p>`;

  const toggle = document.createElement("div");
  toggle.className = "method-toggle";
  [["standard","Standard Array"],["pointbuy","Point Buy (27 pts)"]].forEach(([mk,label])=>{
    const on = state.abilityMethod===mk;
    const chip = document.createElement("button");
    chip.className="chip"+(on?" on":"");
    chip.textContent=label;
    chip.onclick = ()=>{ state.abilityMethod=mk; renderAll(); };
    toggle.appendChild(chip);
  });
  panel.appendChild(toggle);

  const bonus = backgroundBonus();
  const grid = document.createElement("div");
  grid.className = "ability-grid";

  if(state.abilityMethod==="standard"){
    const avail = availableStandardValues();
    ABILS.forEach(a=>{
      const card = document.createElement("div"); card.className="ability-card";
      const current = state.abilityAssign[a];
      const options = [...new Set([...(current?[current]:[]), ...avail])].sort((x,y)=>y-x);
      const sel = document.createElement("select");
      sel.innerHTML = `<option value="">—</option>` + options.map(v=>`<option value="${v}" ${current===v?"selected":""}>${v}</option>`).join("");
      sel.onchange = (e)=>{ state.abilityAssign[a] = e.target.value?Number(e.target.value):null; renderAll(); };
      const finalScore = (current||0) + bonus[a];
      card.innerHTML = `<div class="aname">${ABIL_NAME[a]}</div>`;
      card.appendChild(sel);
      const modLine = document.createElement("div");
      modLine.innerHTML = `<div class="ascore mono">${current?finalScore:"–"}</div><div class="amod mono">${current?fmtMod(mod(finalScore)):""}</div><div class="abonus">${bonus[a]?`+${bonus[a]} background`:""}</div>`;
      card.appendChild(modLine);
      grid.appendChild(card);
    });
  } else {
    ABILS.forEach(a=>{
      const card = document.createElement("div"); card.className="ability-card";
      const base = state.pointBuy[a];
      const finalScore = base + bonus[a];
      card.innerHTML = `<div class="aname">${ABIL_NAME[a]}</div>`;
      const stepper = document.createElement("div"); stepper.className="stepper";
      const minus = document.createElement("button"); minus.textContent="–";
      minus.disabled = base<=8;
      minus.onclick = ()=>{ state.pointBuy[a] = Math.max(8,base-1); renderAll(); };
      const val = document.createElement("span"); val.className="mono"; val.style.minWidth="20px"; val.textContent = base;
      const plus = document.createElement("button"); plus.textContent="+";
      plus.disabled = base>=15 || (pointBuyTotalCost() + (PB_COST[base+1]-PB_COST[base]) > 27);
      plus.onclick = ()=>{ state.pointBuy[a] = Math.min(15,base+1); renderAll(); };
      stepper.appendChild(minus); stepper.appendChild(val); stepper.appendChild(plus);
      card.appendChild(stepper);
      const modLine = document.createElement("div");
      modLine.innerHTML = `<div class="ascore mono">${finalScore}</div><div class="amod mono">${fmtMod(mod(finalScore))}</div><div class="abonus">${bonus[a]?`+${bonus[a]} background`:""}</div>`;
      card.appendChild(modLine);
      grid.appendChild(card);
    });
  }
  panel.appendChild(grid);

  if(state.abilityMethod==="pointbuy"){
    const rem = document.createElement("div");
    rem.className="pb-remaining";
    rem.innerHTML = `Points spent: <b>${pointBuyTotalCost()}</b> / 27`;
    panel.insertBefore(rem, grid);
  } else {
    const rem = document.createElement("div");
    rem.className="pb-remaining";
    const left = availableStandardValues();
    rem.innerHTML = left.length ? `Remaining values to assign: <b>${left.join(", ")}</b>` : `All six scores assigned.`;
    panel.insertBefore(rem, grid);
  }
}

function updateNavState(){
  const key = STEPS[state.step];

}

/* ---- Step 6: Sheet ---- */
function buildSheetStep(panel){

  for(let l=1;l<=5;l++) sel.innerHTML += `<option value="${l}" ${state.level===l?"selected":""}>${l}</option>`;

  levelRow.appendChild(sel);
  panel.appendChild(levelRow);
  const hint = document.createElement("div");

  const backBtn = document.createElement("div");

function buildFullSheetBody(){
  const wrap = document.createElement("div");
  const cls = selectedClass(), sp = selectedSpecies(), bg = selectedBackground();
  const scores = finalAbilityScores();
  const level = state.level;
  const pb = profBonus(level);

  const feats = [];
  if(cls){
    cls.level1Features.forEach(f=>feats.push(f));
    if(level>=4) feats.push({name:"Ability Score Improvement", text:"Gain a feat, or increase one score by 2 (or two scores by 1)."});
    if(state.className==="fighter"){
      if(level>=2) feats.push({name:"Action Surge", text:"Take one additional action on your turn (once per rest)."});
      if(level>=2) feats.push({name:"Tactical Mind", text:"Spend a Second Wind use to add 1d10 to a failed ability check."});
      if(level>=3) feats.push({name:"Fighter Subclass", text:"Choose Battle Master, Champion, Eldritch Knight, or Psi Warrior."});
      if(level>=5) feats.push({name:"Extra Attack", text:"Attack twice with the Attack action."});
      if(level>=5) feats.push({name:"Tactical Shift", text:"Move half Speed without Opportunity Attacks when you use Second Wind."});
    }
    if(state.className==="wizard"){
      if(level>=2) feats.push({name:"Scholar", text:"Gain Expertise in Arcana, History, Investigation, Medicine, Nature, or Religion."});

      if(level>=5) feats.push({name:"Memorize Spell", text:"Swap one prepared spell after a Short Rest."});
    }
    if(state.className==="cleric"){
      if(level>=2) feats.push({name:"Channel Divinity", text:"2 uses: Divine Spark (1d8+Wis heal/harm) or Turn Undead."});
      if(level>=3) feats.push({name:"Cleric Subclass", text:"Choose Life, Light, Trickery, or War Domain."});
      if(level>=5) feats.push({name:"Sear Undead", text:"Turned Undead take Radiant damage equal to your Cleric level."});

    if(state.className==="rogue"){
      if(level>=2) feats.push({name:"Cunning Action", text:"Bonus Action: Dash, Disengage, or Hide."});
      if(level>=3) feats.push({name:"Rogue Subclass", text:"Choose Arcane Trickster, Assassin, Soulknife, or Thief."});

  wrap.innerHTML = `
    <div class="kv-row" style="margin-top:8px;">
      <div class="kv"><span class="k">Class &amp; Level</span><span class="v">${cls?cls.name:"–"} ${level}</span></div>

      <div class="kv"><span class="k">Background</span><span class="v">${state.background||"–"}</span></div>

    </div>

  btn.id = "copySheetBtn";
  btn.textContent = "Copy sheet as text";
  btn.onclick = ()=> copyToClipboard(buildPlainTextSheet());
  wrap.appendChild(btn);

  return wrap;
}

function buildPlainTextSheet(){
  const cls = selectedClass(), sp = selectedSpecies(), bg = selectedBackground();
  const scores = finalAbilityScores();
  const level = state.level, pb = profBonus(level);
  const lines = [];
  lines.push(`${state.identity.name || "Unnamed Character"}`);
  lines.push(`${sp?sp.name:"—"} ${cls?cls.name:"—"} ${level} — ${state.background||"—"} — ${state.alignment||"—"}`);
  lines.push("");
  lines.push(`HP ${computeHP(level)}   AC ${computeAC()}   Proficiency Bonus +${pb}`);
  lines.push("");
  ABILS.forEach(a=> lines.push(`${ABIL_NAME[a]}: ${scores[a]} (${fmtMod(mod(scores[a]))})`));
  lines.push("");
  lines.push("Skills:");
  const skillSet = classSkillSet(), expSet = expertiseSet();
  Object.entries(SKILLS).forEach(([sk,def])=>{
    if(skillSet.has(sk)){
      const bonus = mod(scores[def.ab]) + pb + (expSet.has(sk)?pb:0);
      lines.push(`  ${def.name}: ${fmtMod(bonus)}${expSet.has(sk)?" (Expertise)":""}`);
    }
  });
  return lines.join("\n");
}

/* ============================== SHEET (SIDE PANEL) ============================== */

function renderSheet(){
  const el = document.getElementById("sheetCard");
  const cls = selectedClass(), sp = selectedSpecies(), bg = selectedBackground();
  const scores = finalAbilityScores();
  const level = state.level, pb = profBonus(level);
  const hp = cls ? computeHP(level) : null;
  const ac = computeAC();

  el.innerHTML = `
    <p class="sheet-name">${state.identity.name || "Unnamed Adventurer"}</p>
    <div class="sheet-tagline">${sp?sp.name:"?"} ${cls?cls.name:"?"} ${cls?"· Level "+level:""}${state.background?" · "+state.background:""}</div>
    <div class="sheet-grid3">
      <div class="stat-tile hp"><div class="stat-label">HP</div><span class="stat-num">${hp??"–"}</span></div>
      <div class="stat-tile ac"><div class="stat-label">AC</div><span class="stat-num">${ac}</span></div>
      <div class="stat-tile pb"><div class="stat-label">Prof</div><span class="stat-num">+${pb}</span></div>
    </div>
    <div class="sheet-abilities">
      ${ABILS.map(a=>`<div class="sa"><div class="aab">${a}</div><div class="amod2 mono">${fmtMod(mod(scores[a]||10))}</div><div class="asc mono">${scores[a]||10}</div></div>`).join("")}
    </div>
    <div class="sheet-section">
      <h3>Saving Throws</h3>
      <div class="tagrow">${cls? cls.saves.map(a=>`<span class="tag save">${ABIL_NAME[a]} ${fmtMod(mod(scores[a]||10)+pb)}</span>`).join("") : `<span class="empty-note">Choose a class</span>`}</div>
    </div>
    <div class="sheet-section">
      <h3>Alignment</h3>
      <div class="hint" style="margin:0;">${state.alignment || "—"}</div>
    </div>
  `;
}

/* ============================== INIT ============================== */

document.getElementById("resetBtn").addEventListener("click", ()=>{
  if(confirm("Clear all choices and start a new character?")){
    state = structuredClone(DEFAULT_STATE);
    saveState();
    renderAll();
  }
});

// Prevent invalid step index from stale storage
if(state.step >= STEPS.length) state.step = 0;
if(state.step > furthestUnlockedStep()) state.step = furthestUnlockedStep();

renderAll();
</script>

</body></html>
