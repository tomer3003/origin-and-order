<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Origin &amp; Order — D&amp;D 2024 Character Builder</title>
<meta name="description" content="A character builder for the 2024 Dungeons &amp; Dragons rules: all twelve classes, levels 1 to 20, multiclassing, and a printable sheet.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header class="masthead">
    <div>
      <h1>Origin &amp; Order</h1>
      <div class="sub">A character builder for the 2024 D&amp;D rules — twelve classes, levels 1&ndash;20, multiclassing.</div>
    </div>
    <div class="masthead-right noprint">
      <span id="flash" class="ok" hidden></span>
      <button id="libraryBtn" class="iconbtn" type="button">Saved characters</button>
      <button id="themeToggle" class="iconbtn" type="button" aria-label="Toggle light and dark theme">Theme</button>
    </div>
  </header>

  <nav id="tracker" class="tracker noprint" aria-label="Build steps"></nav>

  <div class="layout">
    <main id="stepPanel" class="panel"></main>
    <aside id="sheet" class="sheet noprint" aria-label="Character summary"></aside>
  </div>

  <footer class="app-footer noprint">
    Spell text adapted from the D&amp;D 5.2 SRD, available under
    <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC&nbsp;BY&nbsp;4.0</a>.
    Class, feat, and species text is our own summary of the 2024 Player's Handbook.
  </footer>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
